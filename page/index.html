<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎使用南宁葱姜蒜的AI 私厨 - 智能食谱助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== 顶部导航栏 ========== -->
<header class="navbar">
    <div class="navbar-brand">
        <span class="logo-icon">🍳</span>
        <h1>AI 私厨</h1>
        <span class="subtitle">智能食谱 RAG 问答系统</span>
    </div>
    <nav class="navbar-tabs">
        <button class="tab-btn active" data-tab="chat">
            <span class="tab-icon">💬</span> 对话问答
        </button>
        <button class="tab-btn" data-tab="search">
            <span class="tab-icon">🔍</span> 菜品检索
        </button>
    </nav>
    <div class="navbar-status">
        <span id="system-status" class="status-badge loading">
            <span class="status-dot"></span>
            <span class="status-text">初始化中...</span>
        </span>
    </div>
</header>

<!-- ========== 主内容区 ========== -->
<main class="main-content">

    <!-- ===== 对话问答面板 ===== -->
    <section id="panel-chat" class="panel active">
        <div class="chat-layout">
            <!-- 左侧：对话区 -->
            <div class="chat-area">
                <!-- 欢迎消息 -->
                <div id="chat-messages" class="chat-messages">
                    <div class="welcome-card">
                        <div class="welcome-banner">
                            <img src="images/meat/糖醋里脊.png" alt="精选菜品" class="welcome-img">
                            <img src="images/soup/玉米排骨汤.png" alt="精选菜品" class="welcome-img">
                            <img src="images/vegetable/地三鲜.png" alt="精选菜品" class="welcome-img">
                            <img src="images/drink/杨枝甘露.png" alt="精选菜品" class="welcome-img">
                        </div>
                        <h2>👨‍🍳 你好，我是你的 AI 私厨！</h2>
                        <p>我可以帮你推荐菜品、查询食谱、提供做菜步骤指导。试试问我：</p>
                        <div class="quick-questions">
                            <button class="quick-q" onclick="askQuickQuestion('有什么好吃的肉菜推荐？')">🥩 推荐肉菜</button>
                            <button class="quick-q" onclick="askQuickQuestion('糖醋里脊怎么做？')">🍖 糖醋里脊做法</button>
                            <button class="quick-q" onclick="askQuickQuestion('有哪些汤品可以做？')">🍲 汤品推荐</button>
                            <button class="quick-q" onclick="askQuickQuestion('简单的家常素菜有哪些？')">🥦 家常素菜</button>
                            <button class="quick-q" onclick="askQuickQuestion('推荐几道适合夏天的饮品')">🧃 夏日饮品</button>
                            <button class="quick-q" onclick="askQuickQuestion('今天吃什么主食好？')">🍚 主食推荐</button>
                        </div>
                    </div>
                </div>

                <!-- 输入区 -->
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea id="chat-input" placeholder="问我任何关于食谱、做菜的问题..." rows="1"
                                  onkeydown="handleInputKeydown(event)"></textarea>
                        <button id="btn-send" class="btn-send" onclick="sendMessage()">
                            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                    </div>
                    <div class="input-hint">按 Enter 发送，Shift+Enter 换行</div>
                </div>
            </div>

            <!-- 右侧：RAG 过程面板 -->
            <aside class="rag-panel" id="rag-panel">
                <div class="rag-panel-header">
                    <h3>🔬 RAG 检索过程</h3>
                    <button class="rag-toggle" onclick="toggleRagPanel()" title="收起/展开">◀</button>
                </div>
                <div id="rag-steps" class="rag-steps">
                    <div class="rag-empty">
                        <span>📋</span>
                        <p>发送问题后，这里会展示 AI 的思考和检索过程</p>
                    </div>
                </div>
            </aside>
        </div>
    </section>

    <!-- ===== 菜品检索面板 ===== -->
    <section id="panel-search" class="panel">
        <!-- 分类筛选栏 -->
        <div class="search-header">
            <h2>🍽️ 菜品图鉴</h2>
            <p class="search-desc">浏览各类菜品，点击查看详情或直接向 AI 提问</p>
            <div class="category-bar">
                <button class="cat-btn active" data-category="all">
                    <span>🍱</span> 全部
                </button>
                <button class="cat-btn" data-category="meat">
                    <span>🥩</span> 荤菜
                </button>
                <button class="cat-btn" data-category="vegetable">
                    <span>🥬</span> 素菜
                </button>
                <button class="cat-btn" data-category="soup">
                    <span>🍲</span> 汤品
                </button>
                <button class="cat-btn" data-category="staple">
                    <span>🍚</span> 主食
                </button>
                <button class="cat-btn" data-category="drink">
                    <span>🧃</span> 饮品
                </button>
            </div>
        </div>

        <!-- 菜品卡片网格 -->
        <div id="dish-grid" class="dish-grid">
            <!-- JS 动态渲染 -->
        </div>
    </section>
</main>

<!-- ========== 菜品详情弹窗 ========== -->
<div id="dish-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeDishModal()">&times;</button>
        <div class="modal-body">
            <img id="modal-img" src="" alt="" class="modal-img">
            <div class="modal-info">
                <h2 id="modal-name"></h2>
                <span id="modal-category" class="modal-cat-badge"></span>
                <div class="modal-actions">
                    <button class="btn-ask-ai" id="modal-ask-btn" onclick="askAboutDish()">
                        🤖 问 AI 怎么做
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
